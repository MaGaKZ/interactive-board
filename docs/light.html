<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depth Light</title>
<style>
  :root { --bg: #000; --fg: #eee; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  canvas { width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; display: block; touch-action: none; }
  #status { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #000c; padding: 8px 14px; border-radius: 8px; }
  #status:empty { display: none; }
  #controls { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; align-items: center; background: #000a; padding: 8px 14px; border-radius: 8px; max-width: calc(100vw - 32px); box-sizing: border-box; }
  #controls label { white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  #hint { opacity: .7; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="controls">
  <label>Color <input id="color" type="color" value="#ffb070"></label>
  <label>Brightness <input id="power" type="range" min="0" max="3" step="0.05" value="1.2"></label>
  <label>Room light <input id="ambient" type="range" min="0" max="1" step="0.05" value="0.35"></label>
  <span id="hint">Drag the light · scroll = closer/further · pinch to grab it</span>
</div>
<div id="status" role="status">Loading…</div>
<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs";

const MODEL_URL = "depth.onnx";
const SCALE = 1.0;          // depth calibration, same as index.html
const DW = 392, DH = 294;   // depth model input
const FOV_Y = 50;           // webcam vertical field of view (deg)
const RANGE = 70;           // cm at which the light is half as strong
const ORB = 900;            // orb radius in px = ORB / distance_cm
const PINCH = 0.35;         // thumb-index gap / hand size below this = pinch
const MEAN = [0.485, 0.456, 0.406], STD = [0.229, 0.224, 0.225];

const status = document.getElementById("status");
const canvas = document.getElementById("gl");
const small = new OffscreenCanvas(DW, DH), sctx = small.getContext("2d", { willReadFrequently: true });
const depth = new Float32Array(DW * DH).fill(1000); // cm, "far" until the model runs
const orb = { u: 0.3, v: 0.45, z: 70 };            // screen position (0..1, top-left origin) + distance in cm
const $ = id => document.getElementById(id);

const VS = `#version 300 es
out vec2 uv;
void main() {
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0); // one full-screen triangle
  uv = vec2((p.x + 1.0) * 0.5, 1.0 - (p.y + 1.0) * 0.5);                     // top-left origin, like the images
  gl_Position = vec4(p, 0.0, 1.0);
}`;
const FS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 outColor;
uniform sampler2D video, depth;
uniform vec2 tanHalf, orbUv, res;
uniform vec3 lightPos, lightCol;
uniform float power, ambient, orbPx, range;
const float SHAPE = 0.45; // 0 = ignore surface direction (smooth glow), 1 = full shading (noisier)

float D(vec2 t) { // bilinear depth by hand: float textures aren't filterable on every GPU
  vec2 s = vec2(textureSize(depth, 0)), f = t * s - 0.5, i = floor(f); f -= i;
  ivec2 a = clamp(ivec2(i), ivec2(0), ivec2(s) - 1), b = clamp(ivec2(i) + 1, ivec2(0), ivec2(s) - 1);
  return mix(mix(texelFetch(depth, a, 0).r, texelFetch(depth, ivec2(b.x, a.y), 0).r, f.x),
             mix(texelFetch(depth, ivec2(a.x, b.y), 0).r, texelFetch(depth, b, 0).r, f.x), f.y);
}

vec3 P(vec2 t) { // pixel -> 3D point in cm (camera at origin, looking +z, y up)
  float d = D(t);
  return vec3((t.x * 2.0 - 1.0) * tanHalf.x * d, (1.0 - t.y * 2.0) * tanHalf.y * d, d);
}

void main() {
  vec3 c = pow(texture(video, uv).rgb, vec3(2.2));             // to linear light
  vec2 e = 3.0 / vec2(textureSize(depth, 0));                   // normals over a few depth pixels: less noise
  vec3 p = P(uv);
  vec3 dx = P(uv + vec2(e.x, 0)) - P(uv - vec2(e.x, 0)), dy = P(uv + vec2(0, e.y)) - P(uv - vec2(0, e.y));
  vec3 n = normalize(cross(dx, dy));
  if (n.z > 0.0) n = -n;                                        // surfaces face the camera
  float jump = max(abs(dx.z), abs(dy.z)) / p.z;                 // object edge: depth jumps, normal is garbage
  n = normalize(mix(n, vec3(0, 0, -1), smoothstep(0.04, 0.15, jump)));

  vec3 L = lightPos - p; float dist = length(L);
  float diff = mix(1.0, max((dot(n, L / dist) + 0.3) / 1.3, 0.0), SHAPE); // mostly distance, a bit of surface direction
  float att = 1.0 / (1.0 + pow(dist / range, 2.0));
  vec3 col = c * (ambient + lightCol * power * diff * att * 6.0);

  // the orb itself: bright core + halo, hidden where a real surface is in front of it
  float r = length((uv - orbUv) * res) / orbPx;
  float visible = smoothstep(-3.0, 3.0, D(uv) - lightPos.z);
  col += lightCol * (smoothstep(1.0, 0.75, r) * 2.0 + exp(-r * 0.8) * 0.5 * power) * visible;

  outColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;

function setStatus(s) { status.textContent = s; }

function program(gl) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, FS]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p); gl.useProgram(p);
  return p;
}

function texture(gl, unit) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, k, gl.NEAREST); // float depth isn't filterable everywhere
  for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE);
  return t;
}

const hex = h => [1, 3, 5].map(i => (parseInt(h.slice(i, i + 2), 16) / 255) ** 2.2); // sRGB hex -> linear rgb

async function start() {
  const video = document.createElement("video");
  video.playsInline = true; video.muted = true;
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  } catch (e) {
    return setStatus("Camera blocked: allow camera access for this site and reload.");
  }
  await video.play();
  const W = canvas.width = video.videoWidth, H = canvas.height = video.videoHeight;
  const frame = new OffscreenCanvas(W, H), fctx = frame.getContext("2d");

  const gl = canvas.getContext("webgl2");
  if (!gl) return setStatus("This browser has no WebGL2.");
  const prog = program(gl);
  const u = name => gl.getUniformLocation(prog, name);
  const videoTex = texture(gl, 0), depthTex = texture(gl, 1);
  gl.uniform1i(u("video"), 0); gl.uniform1i(u("depth"), 1);
  const tanY = Math.tan(FOV_Y / 2 * Math.PI / 180);
  gl.uniform2f(u("tanHalf"), tanY * W / H, tanY);
  gl.uniform2f(u("res"), W, H);
  gl.uniform1f(u("range"), RANGE);

  setStatus("Loading hand model…");
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm");
  const hands = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task", delegate: "GPU" },
    runningMode: "VIDEO", numHands: 2,
  });
  setStatus("Loading depth model (~100 MB, cached after first visit)…");
  const session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ["webgpu", "wasm"] });
  setStatus("");

  depthLoop(session, frame);
  let heldByHand = false;
  (function render() {
    fctx.setTransform(-1, 0, 0, 1, W, 0); fctx.drawImage(video, 0, 0); // mirrored camera image

    heldByHand = pinchGrab(hands.detectForVideo(frame, performance.now()).landmarks, heldByHand, W / H);

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, videoTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, frame);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depthTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, DW, DH, 0, gl.RED, gl.FLOAT, depth);

    const z = orb.z;
    gl.uniform3f(u("lightPos"), (orb.u * 2 - 1) * tanY * (W / H) * z, (1 - orb.v * 2) * tanY * z, z);
    gl.uniform3f(u("lightCol"), ...hex($("color").value));
    gl.uniform1f(u("power"), +$("power").value);
    gl.uniform1f(u("ambient"), +$("ambient").value);
    gl.uniform2f(u("orbUv"), orb.u, orb.v);
    gl.uniform1f(u("orbPx"), ORB / z);
    gl.viewport(0, 0, W, H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(render);
  })();
}

// depth model runs as fast as it can, independent of rendering
async function depthLoop(session, frame) {
  const input = new Float32Array(3 * DH * DW), raw = new Float32Array(DW * DH), tmp = new Float32Array(DW * DH);
  let first = true;
  for (;;) {
    sctx.drawImage(frame, 0, 0, DW, DH);
    const px = sctx.getImageData(0, 0, DW, DH).data;
    for (let i = 0; i < DW * DH; i++)
      for (let c = 0; c < 3; c++) input[c * DW * DH + i] = (px[i * 4 + c] / 255 - MEAN[c]) / STD[c];
    const out = await session.run({ image: new ort.Tensor("float32", input, [1, 3, DH, DW]) });
    const m = out.depth.data;
    for (let i = 0; i < m.length; i++) raw[i] = m[i] * 100 * SCALE;
    blur(raw, tmp, 4); blur(raw, tmp, 4); // two box blurs ~ gaussian: removes blocky noise
    for (let i = 0; i < m.length; i++) depth[i] = first ? raw[i] : 0.5 * depth[i] + 0.5 * raw[i]; // steadier over time
    first = false;
  }
}

// separable box blur of a DW x DH image, in place (tmp is scratch)
function blur(a, tmp, r) {
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    let s = 0, n = 0;
    for (let k = Math.max(0, x - r); k <= Math.min(DW - 1, x + r); k++) { s += a[y * DW + k]; n++; }
    tmp[y * DW + x] = s / n;
  }
  for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
    let s = 0, n = 0;
    for (let k = Math.max(0, y - r); k <= Math.min(DH - 1, y + r); k++) { s += tmp[k * DW + x]; n++; }
    a[y * DW + x] = s / n;
  }
}

const depthAt = (x, y) => depth[Math.min(DH - 1, Math.max(0, Math.floor(y * DH))) * DW + Math.min(DW - 1, Math.max(0, Math.floor(x * DW)))];

// pinch (thumb tip + index tip together) near the orb grabs it; it follows the pinch and sits at the hand's depth
function pinchGrab(allHands, held, aspect) {
  for (const lms of allHands) {
    const d = (a, b) => Math.hypot((lms[a].x - lms[b].x) * aspect, lms[a].y - lms[b].y);
    if (d(4, 8) / d(0, 9) > PINCH) continue;
    const pu = (lms[4].x + lms[8].x) / 2, pv = (lms[4].y + lms[8].y) / 2;
    if (!held && Math.hypot((pu - orb.u) * aspect, pv - orb.v) > 0.12) continue;
    const palm = [0, 5, 9, 13, 17].map(i => depthAt(lms[i].x, lms[i].y)).sort((a, b) => a - b)[2]; // median
    orb.u = pu; orb.v = pv;
    orb.z = 0.7 * orb.z + 0.3 * Math.max(15, palm - 3); // a little in front of the hand, smoothed
    return true;
  }
  return false;
}

// mouse / touch: drag the orb, wheel moves it closer/further
let dragging = false;
const toUv = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
const onOrb = e => { const [x, y] = toUv(e), r = canvas.getBoundingClientRect(); return Math.hypot((x - orb.u) * r.width, (y - orb.v) * r.height) < Math.max(24, ORB / orb.z * r.width / canvas.width * 2); };
canvas.addEventListener("pointerdown", e => { if (onOrb(e)) { dragging = true; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = "grabbing"; } });
canvas.addEventListener("pointermove", e => {
  if (dragging) [orb.u, orb.v] = toUv(e);
  else canvas.style.cursor = onOrb(e) ? "grab" : "default";
});
canvas.addEventListener("pointerup", () => { dragging = false; canvas.style.cursor = "grab"; });
canvas.addEventListener("wheel", e => { e.preventDefault(); orb.z = Math.min(300, Math.max(15, orb.z * Math.exp(e.deltaY * 0.001))); }, { passive: false });

start().catch(e => { console.error(e); setStatus("Error: " + e.message); });
</script>
</body>
</html>
